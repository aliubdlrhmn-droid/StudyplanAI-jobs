name: StudyPlan AI Job Search

on:
  schedule:
    # 7am UK time Mon–Fri (UTC in winter)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # manual trigger

jobs:
  search-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run job search
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python job_search.py

      - name: Commit updated seen_jobs.csv
        run: |
          git config user.name "StudyPlan AI Bot"
          git config user.email "abdulrahman@studyplanai.co.uk"
          git add seen_jobs.csv
          git diff --staged --quiet || git commit -m "Update seen_jobs — $(date '+%Y-%m-%d')"
          git push
